[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeris-backend"
version = "0.1.0"
description = "AERIS backend: source-grounded aviation RAG API (education / simulation only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic-settings>=2.2",
  "pypdf>=4.2",                 # BSD-licensed PDF text extraction
  "fonttools>=4.40",            # lets pypdf decode CFF/Type1 fonts (e.g. the Spanair report)
  "langchain-core>=0.3",
  "langchain-text-splitters>=0.3",
  "langchain-chroma>=0.2",      # Chroma vector store integration (Phase 1)
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]
openai = ["langchain-openai>=0.3"]
local-embeddings = ["fastembed>=0.3"]   # ONNX embeddings, no PyTorch needed
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
aeris = "aeris.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: runs against the real, large PDF reports (run with: pytest -m slow)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
